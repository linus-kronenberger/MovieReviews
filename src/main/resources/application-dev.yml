server:
    port: ${APPLICATION_PORT:8080}
    servlet:
        session:
            tracking-modes: cookie

spring:
    sql:
        init:
            mode: always
    mustache:
        check-template-location: false
    datasource:
        url: jdbc:h2:file:./data/moviereviews;AUTO_SERVER=TRUE
        username: ${DB_USERNAME:user}
        password: ${DB_PASSWORD:password}
        driverClassName: org.h2.Driver
    jpa:
        database-platform: org.hibernate.dialect.H2Dialect
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: create-drop
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    flyway:
        enabled: false

vaadin:
    allowed-packages: com.vaadin,org.vaadin,dev.hilla,com.linus.application
    frontend:
        hotdeploy: true
    launch-browser: true

jwt:
    auth:
        secret: ${JWT_AUTH_SECRET:J6GOtcwC2NJI1l0VkHu20PacPFGTxpirBxWwynoHjsc=}
