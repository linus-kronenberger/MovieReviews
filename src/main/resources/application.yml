logging:
    level:
        org:
            atmosphere: warn
server:
    port: ${PORT:8080}
spring:
    mustache:
        check-template-location: false
    datasource:
        url: jdbc:h2:mem:mydb
        username: sa
        password: password
        driverClassName: org.h2.Driver
        jpa:
            database-platform: org.hibernate.dialect.H2Dialect
            defer-datasource-initialization: true
vaadin:
    frontend:
        hotdeploy: true
    launch-browser: true
