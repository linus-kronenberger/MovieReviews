server:
  port: ${APPLICATION_PORT:8080}
  servlet:
    session:
      tracking-modes: cookie

spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moviereviews}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  mustache:
    check-template-location: false

vaadin:
  allowed-packages: com.vaadin,org.vaadin,dev.hilla,com.linus.application
  frontend:
    hotdeploy: false
  launch-browser: false

jwt:
  auth:
    secret: ${JWT_AUTH_SECRET:J6GOtcwC2NJI1l0VkHu20PacPFGTxpirBxWwynoHjsc=}
