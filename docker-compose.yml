version: "3.8"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moviereviews}
      POSTGRES_USER: ${DB_USERNAME:-moviereviews}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moviereviews}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-moviereviews} -d ${DB_NAME:-moviereviews}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-moviereviews}
      DB_USERNAME: ${DB_USERNAME:-moviereviews}
      DB_PASSWORD: ${DB_PASSWORD:-moviereviews}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
